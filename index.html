<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>drum kit project</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <h1>Drum Kit</h1> 
      <p>Start smashing by clicking or by using keyboard</p>
    </header>
    
    <main>
      <div class="container">
        <button class="btn" value="cl_hihat">A</button>
        <button class="btn" value="claves">S</button>
        <button class="btn" value="conga1">D</button>
        <button class="btn" value="cowbell">F</button>
        <button class="btn" value="crashcym">G</button>
        <button class="btn" value="handclap">H</button>
        <button class="btn" value="hi_conga">J</button>
        <button class="btn" value="hightom">K</button>
        <button class="btn" value="kick1">L</button>
        <button class="btn" value="kick2">Q</button>
        <button class="btn" value="maracas">W</button>
        <button class="btn" value="open_hh">E</button>
        <button class="btn" value="rimshot">R</button>
        <button class="btn" value="snare">T</button>
        <button class="btn" value="tom1">Y</button>
      </div>
    </main>

    <footer>
      <p>the drum web site Co.</p>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
